version: "2"

linters:
  default: none
  enable: [errcheck, gosec, staticcheck, unused, ineffassign, bodyclose, noctx, misspell, govet, gocognit, gocyclo, nestif]
  settings:
    # Functions stay small enough to read in one go; tests are exempt, as tables of cases.
    gocognit: {min-complexity: 40}
    gocyclo: {min-complexity: 25}
    nestif: {min-complexity: 6}
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx, gocognit, gocyclo, nestif]
      # Files the operator names: on the command line, in zeroreads.yaml, or through GitHub Actions.
      - path: (cmd/zeroreads/main\.go|internal/app/)
        text: (G304|G703)
        linters: [gosec]
      # Test-data generators: seeded and reproducible on purpose, never used for anything secret.
      - path: (internal/automaton/generate\.go|internal/gen/)
        text: G404
        linters: [gosec]
      # regexp/syntax packs instruction arguments and empty-width flags into small integer fields,
      # bounded by the syntax package; runes are bounded by utf8.MaxRune, and the lexer converts a
      # rune to a byte only below utf8.RuneSelf.
      - path: (internal/automaton/|internal/logql/lexer\.go)
        text: G115
        linters: [gosec]
      # Requests go only to the URLs the operator configured.
      - path: internal/fetch/fetch\.go
        text: G704
        linters: [gosec]
