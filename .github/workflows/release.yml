name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # a rehearsal: everything a release does except signing and publishing
permissions: {}
jobs:
  # A release is a commit on main that CI passed: the e2e on kind, the runtime suite and the rest.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # to find this commit's CI run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then echo "no successful CI run for $GITHUB_SHA"; exit 1; fi
  release:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # the GitHub release
      packages: write  # the image on ghcr.io
      id-token: write  # keyless cosign signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: the published image and checksums carry this workflow's signatures, and the image runs this version
        run: ./scripts/verify-release.sh "${GITHUB_REF_NAME#v}"
  rehearse:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - run: goreleaser release --snapshot --clean --skip=sign
      - name: every archive carries the licences, and the checksums hold
        run: |
          for a in dist/*.tar.gz; do tar -tzf "$a" | grep -qx THIRD_PARTY_LICENSES || { echo "$a lacks THIRD_PARTY_LICENSES"; exit 1; }; done
          (cd dist && sha256sum -c checksums.txt --ignore-missing)
