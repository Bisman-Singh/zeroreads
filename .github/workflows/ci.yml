name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Every action is pinned to a commit, every tool to the version the suites were verified with, and the
# runner to the Ubuntu release they run on.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # pins the exact Go release the module declares
      - run: ./scripts/check.sh
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: goinstall # built with the module's Go: an older build refuses a newer target
          args: --build-tags e2e,docker
  vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the tip
          persist-credentials: false
      - name: gitleaks v8.30.1, checked against its published SHA-256
        run: |
          curl -fsSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - run: /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner .
  runtimes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./scripts/check-runtimes.sh
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # The runner image ships toolchains this job never uses. The cluster's images and volumes need
      # the room: with the disk near full, the kubelet evicts pods and OpenSearch stops writing.
      - name: runner resources, and room for the cluster
        run: |
          nproc; free -m; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: helm v4.0.4, checked against its published SHA-256
        run: |
          curl -fsSLo /tmp/helm.tgz https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
          echo "29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - run: go install sigs.k8s.io/kind@v0.31.0
      - run: ./e2e/run.sh
        env:
          E2E_GRAFANA_DASHBOARDS: "2000" # the local benchmark uses 5000; this bounds the hosted runner's time
      - name: cluster state after a failure
        if: failure()
        run: ./e2e/diagnose.sh
