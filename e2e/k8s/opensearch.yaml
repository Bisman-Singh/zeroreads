apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: sievelog-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: opensearch}
  template:
    metadata:
      labels: {app: opensearch}
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
          securityContext: {privileged: true}
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.8.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: discovery.type, value: single-node}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms1536m -Xmx1536m"}
            - {name: OPENSEARCH_INITIAL_ADMIN_PASSWORD, value: "E2e-only-Passw0rd!"}
            - {name: plugins.security.audit.type, value: internal_opensearch}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "false"}
          ports:
            - containerPort: 9200
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sk -u admin:E2e-only-Passw0rd! https://localhost:9200/_cluster/health | grep -q status"]
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: sievelog-system
spec:
  selector: {app: opensearch}
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-dashboards-config
  namespace: sievelog-system
data:
  opensearch_dashboards.yml: |
    server.host: "0.0.0.0"
    opensearch.hosts: ["https://opensearch:9200"]
    opensearch.ssl.verificationMode: none
    opensearch.username: kibanaserver
    opensearch.password: kibanaserver
    opensearch.requestHeadersAllowlist: [authorization, securitytenant]
    opensearch_security.multitenancy.enabled: true
    opensearch_security.multitenancy.tenants.preferred: [Private, Global]
    opensearch_security.readonly_mode.roles: [kibana_read_only]
    opensearch_security.cookie.secure: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: sievelog-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: opensearch-dashboards}
  template:
    metadata:
      labels: {app: opensearch-dashboards}
    spec:
      containers:
        - name: dashboards
          image: opensearchproject/opensearch-dashboards:3.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5601
          volumeMounts:
            - {name: config, mountPath: /usr/share/opensearch-dashboards/config/opensearch_dashboards.yml, subPath: opensearch_dashboards.yml}
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
              httpHeaders: [{name: Authorization, value: "Basic YWRtaW46RTJlLW9ubHktUGFzc3cwcmQh"}]  # the e2e admin
            periodSeconds: 5
            failureThreshold: 120
          resources:
            requests: {memory: 512Mi}
      volumes:
        - name: config
          configMap: {name: opensearch-dashboards-config}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: sievelog-system
spec:
  selector: {app: opensearch-dashboards}
  ports:
    - port: 5601
      targetPort: 5601
