apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: zeroreads-system
spec:
  selector:
    matchLabels: {app: vector}
  template:
    metadata:
      labels: {app: vector}
    spec:
      containers:
        - name: vector
          image: timberio/vector:0.58.0-debian
          imagePullPolicy: IfNotPresent
          args: ["--config", "/conf/vector.yaml"]
          securityContext:
            runAsUser: 0 # reads kubelet pod logs and writes to the host mount
          volumeMounts:
            - {name: conf, mountPath: /conf}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: out, mountPath: /e2e/out}
            - {name: data, mountPath: /var/lib/vector}
      volumes:
        - name: conf
          configMap: {name: vector-config}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: out
          hostPath: {path: /e2e/out, type: DirectoryOrCreate}
        - name: data
          emptyDir: {}
