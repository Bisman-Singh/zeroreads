apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: zeroreads-system
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      log_level: info
      grpc_server_max_recv_msg_size: 104857600
      grpc_server_max_send_msg_size: 104857600
    frontend_worker:
      grpc_client_config:
        max_recv_msg_size: 104857600
        max_send_msg_size: 104857600
    query_scheduler:
      grpc_client_config:
        max_recv_msg_size: 104857600
        max_send_msg_size: 104857600
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      reject_old_samples: false
      max_entries_limit_per_query: 200000
      volume_enabled: true
      # The scale test pushes a million lines in a minute.
      ingestion_rate_mb: 256
      ingestion_burst_size_mb: 512
      per_stream_rate_limit: 256MB
      per_stream_rate_limit_burst: 512MB
    frontend:
      # Log every query, so usage evidence can be read from the query log.
      log_queries_longer_than: -1ns
      query_stats_enabled: true
    query_range:
      cache_results: false
    ruler:
      enable_api: true
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /tmp/loki-rules
    pattern_ingester:
      enabled: true
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  namespace: zeroreads-system
data:
  rules.yaml: |
    groups:
      - name: checkout
        rules:
          - alert: HealthzMissing
            expr: absent_over_time({service_name="checkout"} |= "healthz" [5m])
            for: 5m
          - alert: PaymentsDeclined
            expr: sum(count_over_time({service_name="checkout"} |= "declined" [5m])) > 100
          - record: checkout:requests:rate1m
            expr: sum(rate({service_name="checkout"} |= "status" [1m]))
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: zeroreads-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext:
        runAsUser: 0
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki.yaml", "-target=all"]
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            periodSeconds: 3
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
            - {name: rules, mountPath: /loki/rules/fake}
      volumes:
        - name: rules
          configMap: {name: loki-rules}
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: zeroreads-system
spec:
  selector: {app: loki}
  ports:
    - port: 3100
      targetPort: 3100
