apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sievelog.fullname" . }}-verify
  labels:
    {{- include "sievelog.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "sievelog.labels" . | nindent 12 }}
          annotations:
            checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "sievelog.serviceAccountName" . }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: verify
              image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # The rules that remain safe are printed into the Job's log, which outlives the pod.
              args: ["verify", "-c", "/etc/sievelog/sievelog.yaml", "-rules", "/etc/sievelog/rules.json", "-o", "-"{{ if .Values.deployed }}, "-deployed", "/etc/sievelog/deployed.yaml"{{ end }}]
              {{- with .Values.env }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.envFrom }}
              envFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - {name: config, mountPath: /etc/sievelog, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: config
              configMap:
                name: {{ include "sievelog.fullname" . }}
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
