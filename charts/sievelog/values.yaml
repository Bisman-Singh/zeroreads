image:
  repository: ghcr.io/bisman-singh/sievelog
  tag: ""          # defaults to the chart appVersion
  digest: ""       # sha256:... runs exactly the image a release published and signed, whatever the tag
  pullPolicy: IfNotPresent

# How often enforced rules are re-checked. A failed Job (exit code 3) means a rule is no longer safe;
# its logs list the reason and the revert.
schedule: "*/15 * * * *"
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 5
backoffLimit: 0
activeDeadlineSeconds: 900

# config, rules, files and deployed are stored in a ConfigMap: keep credentials out of them and pass
# them through env or envFrom instead, as the *_env settings and the pipelines' ${env:...} expect.

# sievelog.yaml, verbatim. Paths inside it must point under /etc/sievelog.
config: ""
# rules.json produced by `sievelog analyze` and currently enforced, verbatim.
rules: ""
# Extra files placed next to the config, e.g. the collector configuration: {name: content}.
files: {}
# The pipeline config actually deployed, verbatim. When set, verify also fails if it is not exactly
# what emit produces for the rules (a hand edit, or rules deployed from another rules.json).
deployed: ""

# Environment for credentials referenced by *_env settings in the config.
env: []
envFrom: []

serviceAccount:
  create: true
  name: ""

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

nodeSelector: {}
tolerations: []
affinity: {}
