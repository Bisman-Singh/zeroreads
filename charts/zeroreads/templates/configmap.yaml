{{- if not .Values.config }}{{ fail "config (zeroreads.yaml) is required" }}{{ end }}
{{- if not .Values.rules }}{{ fail "rules (the enforced rules.json) is required" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zeroreads.fullname" . }}
  labels:
    {{- include "zeroreads.labels" . | nindent 4 }}
data:
  zeroreads.yaml: |
    {{- .Values.config | nindent 4 }}
  rules.json: |
    {{- .Values.rules | nindent 4 }}
  {{- with .Values.deployed }}
  deployed.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- range $name, $content := .Values.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
