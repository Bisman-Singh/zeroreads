version: 2
project_name: zeroreads

before:
  hooks:
    - go mod verify

builds:
  - id: zeroreads
    main: ./cmd/zeroreads
    binary: zeroreads
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The same files, owners and times on every machine, so an archive is the same bytes wherever it is built.
    builds_info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}
    files:
      - {src: LICENSE, info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}}
      - {src: NOTICE, info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}}
      - {src: THIRD_PARTY_LICENSES, info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}}
      - {src: README.md, info: {owner: root, group: root, mtime: "{{ .CommitDate }}"}}

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]

# The image the Helm chart and the GitHub Action run, at the release version.
dockers_v2:
  - id: image
    ids: [zeroreads]
    images: [ghcr.io/bisman-singh/zeroreads]
    tags: ["{{ .Version }}", "v{{ .Major }}"]
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    extra_files: [LICENSE, NOTICE, THIRD_PARTY_LICENSES]
    labels:
      org.opencontainers.image.source: https://github.com/Bisman-Singh/zeroreads
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

docker_signs:
  - artifacts: images
    args: ["sign", "--yes", "${artifact}@${digest}"]

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

release:
  github:
    owner: Bisman-Singh
    name: zeroreads
  draft: true
